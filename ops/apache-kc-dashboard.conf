# KC Dashboard vhost. Include from httpd.conf (card 07). Loopback only.

Listen 127.0.0.1:8787
Listen [::1]:8787

# Port 80 (htdocs) serves nothing from the project folder, and no .htaccess can re-grant it.
<Directory "C:/xampp/htdocs/_kc-dashboard">
    AllowOverride None
    Options None
    Require all denied
</Directory>

<VirtualHost 127.0.0.1:8787 [::1]:8787>
    ServerName 127.0.0.1
    ServerAlias localhost
    DocumentRoot "C:/xampp/htdocs/_kc-dashboard/public"

    # Refuse anything outside public/ (inherited Alias, ScriptAlias, Location, proxy).
    <If "%{REQUEST_FILENAME} !~ m#^C:/xampp/htdocs/_kc-dashboard/public(/|$)#i || ! -e %{REQUEST_FILENAME}">
        Require all denied
    </If>

    <Directory "C:/xampp/htdocs/_kc-dashboard/public">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    php_admin_flag display_errors off
</VirtualHost>
